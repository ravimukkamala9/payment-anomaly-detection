server.port=8000
spring.application.name=anomaly-detection-backend-java
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Embedded H2, in-memory, one instance for the app's lifetime (DB_CLOSE_DELAY=-1
# keeps it alive across connections -- without it H2 drops the DB the moment
# the first connection closes, since nothing else references it by default).
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
